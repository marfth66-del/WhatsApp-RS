name: Build WhatsApp RS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android
        run: |
          unzip -q WhatsApp_RS_Flutter_Starter.zip
          cd whatsapp_rs
          flutter create . --platforms=android
          cp ../google-services.json android/app/google-services.json

          sed -i '/plugins {/a\    id("com.google.gms.google-services") version "4.5.0" apply false' android/settings.gradle.kts

          sed -i '/plugins {/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts

      - name: Build APK
        run: |
          cd whatsapp_rs
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-RS-APK
          path: whatsapp_rs/build/app/outputs/flutter-apk/app-release.apk
          
